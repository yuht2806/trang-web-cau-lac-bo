<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký </title>
    <link rel="stylesheet" href="styleDK.css">
</head>
<body>
    <div class="anh-nen-mo"></div> <!--phần nền mờ-->

    <div class="container"> <!--phần chứa nội dung chính-->
        <h1>Form đăng ký</h1>
        
        <form action="https://formspree.io/f/movgpjbb" method="post"> <!--CHƯA TRỎ TRANG WEB VÀ NƠI GỬI TT ĐKI-->
            <input type="hidden" name="_language" value="vi">
            
            <label for="ho_ten">Họ Tên:</label> 
            <input type="text" id="ho_ten" name="ho_ten" required placeholder="Nhập Họ và Tên "> <!--Tên đầy đủ của người đăng ký-->

            <label for="hoc_sinh_lop">Lớp:</label>
            <input type="text" id="hoc_sinh_lop" name="hoc_sinh_lop" required placeholder="Nhập lớp của bạn ">  <!--Lớp học của người đăng ký-->
            
            <label for="email">Email (nếu có):</label>
            <input type="email" id="email" name="email" placeholder="Email đăng kí tham gia"> <!--Địa chỉ email của người đăng ký-->

            <label for="so_dien_thoai">Số điện thoại(nhận thông tin ):</label>
            <input type="tel" id="so_dien_thoai" name="so_dien_thoai" required placeholder="Số điện thoại "> <!--Số điện thoại của người đăng ký-->  

            <hr>
 
            <fieldset> 
                <legend>Câu lạc bộ bạn muốn tham gia:</legend>  
                 
                <div class="club-option"> 
                    <input type="checkbox" id="clb_tin_hoc" name="clb_tham_gia[]" value="Tin Học">
                    <label for="clb_tin_hoc">💻 Câu Lạc Bộ Tin Học</label>
                </div>

                <div class="club-option">
                    <input type="checkbox" id="clb_bong_chuyen" name="clb_tham_gia[]" value="Bóng Chuyền">
                    <label for="clb_bong_chuyen">⚽ Câu Lạc Bóng Chuyền</label>
                </div>

                <div class="club-option">
                    <input type="checkbox" id="clb_co_vua" name="clb_tham_gia[]" value="Cờ Vua">
                    <label for="clb_co_vua">🎤 Câu Lạc Bộ Cờ Vua</label>
                </div>
                
            </fieldset>

            <button type="submit">Tham gia ngay</button> 
            
        </form>
       <audio loop autoplay src="/audio/nhacxoso.mp3">
       </audio>
            
    </div>

</body>

</html>
